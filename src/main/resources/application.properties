spring.application.name=spring-boot-caching

spring.datasource.url=jdbc:h2:mem:weather_service_db
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=root
spring.datasource.password=Password
spring.h2.console.enabled=true

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.cache.type=redis
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.cache.cache-names=weather

# NOTE: The actual TTL and serializer used are defined in AppConfig's
# custom RedisCacheManager bean (Java config takes precedence and gives per-cache control).
# These two properties are left here mainly as documentation/fallback
# in case the custom bean is ever removed.
spring.cache.redis.time-to-live=600000
spring.cache.redis.cache-null-values=false